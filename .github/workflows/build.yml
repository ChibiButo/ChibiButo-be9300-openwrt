name: Build BE9300 OpenWrt (2.4 GHz test, initramfs)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  # Pinned base the patches were written against (openwrt main, 2026-10-21)
  OPENWRT_SHA: a31dd90f6974a935b16aea8c7c31eeec1aac18c1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - uses: actions/checkout@v4

      - name: Fetch OpenWrt at pinned commit
        run: |
          git init openwrt
          cd openwrt
          git remote add origin "$OPENWRT_REPO"
          git fetch --depth 1 origin "$OPENWRT_SHA"
          git checkout -q FETCH_HEAD

      - name: Apply BE9300 patches and overlay
        run: |
          cd openwrt
          git -c user.name=ci -c user.email=ci@localhost am ../patches/*.patch
          cp -a ../files ./files
          ls -laR files

      - name: Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp ../be9300.diffconfig .config
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommbe_ipq95xx_DEVICE_tplink_archer-be550-v1=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-ath11k-ahb=y' .config
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config
          ./scripts/diffconfig.sh > ../final.diffconfig
          cat ../final.diffconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 || make download -j1 V=s

      - name: Build
        run: |
          cd openwrt
          make -j$(($(nproc)+1)) || make -j1 V=s

      - name: Collect images
        if: always()
        run: |
          mkdir -p out
          cp -a openwrt/bin/targets/qualcommbe/ipq95xx/* out/ 2>/dev/null || true
          cp final.diffconfig out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: be9300-openwrt-initramfs
          path: out/
          if-no-files-found: warn
